name: Audit PoC Links

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-updates
  queue: max
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 4,000 repositories and 3,000 reference links a day sweeps the whole
      # index about weekly, in around half an hour. A sample found one link in
      # eight pointing at a deleted repository under the old fortnightly sweep.
      - name: Drop dead links and refresh repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/audit_poc_links.py --limit 4000 --references 3000

      - name: Verify the generated index
        run: python3 scripts/build_site.py

      - name: Record published artifact releases
        run: python3 scripts/releases.py --record

      - name: Refresh published counts
        run: |
          python3 .github/hero.py
          python3 .github/getTrending.py --counts-only

      - name: Check for changes and commit
        id: commit
        run: |
          git config user.name 'CVE-BOT'
          git config user.email 'bot@pocindex.io'

          git add --all -- \
            .github/link_audit_state.json \
            index/github.txt \
            index/repo_meta.json \
            index/kev.json \
            index/references.txt \
            README.md \
            docs/hero.svg \
            docs/social-card.svg \
            docs/stats.json \
            docs/kev.svg \
            index/releases/ \
            cves/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Drop PoC links to deleted repositories $(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected; replaying onto the current main (attempt $attempt)"
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1

      # Commits pushed with the workflow token raise no push event, so site.yml
      # would otherwise wait for its daily schedule. Dispatching is exempt.
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
